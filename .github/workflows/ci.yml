name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_twinrun.py
      # A repository whose answers are known, swept end to end. Fails on a miss
      # or a false positive; a "ceiling" case staying silent is expected.
      - run: python sandbox.py

  # The tool verifies its own pull requests. If this is too noisy to live with,
  # that is the finding: the whole thesis rests on the output being signal.
  twinrun:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify this pull request against its base
        run: python -m twinrun.cli . --base "origin/${{ github.base_ref }}" --head HEAD
